<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Off the map · Mohamad Fakhouri</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&family=VT323&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;font-family:VT323,monospace;color:#fbf1dc;text-align:center;
  background:radial-gradient(#fbf1dc 1px,transparent 1.5px) 0 0/47px 53px,radial-gradient(#fbf1dc .8px,transparent 1.2px) 19px 23px/71px 61px,linear-gradient(#0e1030,#252650 70%,#4b3a6a)}
main{padding:24px}
img{width:200px;height:200px;image-rendering:pixelated;border:4px solid #3a2418;box-shadow:6px 6px 0 rgba(0,0,0,.4);margin-bottom:22px}
h1{font:600 30px/1.1 "Pixelify Sans",monospace;margin:0 0 10px;letter-spacing:.04em}
p{font-size:24px;margin:0 0 24px;opacity:.9}
a{display:inline-block;font-size:22px;color:#3a2418;background:#fbf1dc;border:3px solid #3a2418;box-shadow:4px 4px 0 rgba(0,0,0,.45);padding:6px 14px 7px;text-decoration:none}
a:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.45)}
</style>
</head>
<body>
<main>
  <img src="/assets/favicon.png" alt="A traveller on a camel">
  <h1>YOU WANDERED OFF THE MAP</h1>
  <p>There is nothing out here but sand. The camp is this way.</p>
  <a href="/">◀ back to camp</a>
</main>
</body>
</html>
